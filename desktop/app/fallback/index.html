<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proyectos Nebrija App</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #09090b;
        color: #f4f4f6;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        width: 100%;
        background: #0e0e12;
        border: 1px solid #22222a;
        border-radius: 16px;
        padding: 28px;
        text-align: center;
      }
      h1 { font-size: 18px; margin-top: 14px; }
      p { font-size: 13px; color: #9c9caf; margin-top: 8px; line-height: 1.5; }
      button {
        margin-top: 18px;
        background: #3b82f6;
        color: #ffffff;
        border: 0;
        border-radius: 8px;
        padding: 10px 18px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { background: #2563eb; }
    </style>
  </head>
  <body>
    <div class="card">
      <svg width="48" height="48" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="2" width="60" height="60" rx="14" fill="#0E0E12" stroke="#282834" stroke-width="2" />
        <path d="M18 46V18H24.2L39.8 38.2V18H46V46H39.8L24.2 25.8V46H18Z" fill="#F4F4F6" />
        <rect x="39.8" y="18" width="6.2" height="10" rx="1.5" fill="#3B82F6" />
      </svg>
      <h1>Sin conexion con el servidor</h1>
      <p>Comprueba tu conexion a internet para cargar Proyectos Nebrija App en tiempo real.</p>
      <button onclick="window.location.href='https://nebrija-proyectos-bien.vercel.app'">
        Reintentar conexion
      </button>
    </div>
  </body>
</html>
