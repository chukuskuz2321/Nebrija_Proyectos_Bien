[package]
name = "proyectos-nebrija-setup"
version = "1.0.0"
description = "Instalador animado personalizado de Proyectos Nebrija App para Windows"
authors = ["Proyectos Nebrija App"]
edition = "2021"

[lib]
name = "proyectos_nebrija_setup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
